name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        jdk: [21]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594
      with:
        egress-policy: block
        disable-telemetry: true
        allowed-endpoints: >
          api.github.com:443
          github.com:443
          repo.maven.apache.org:443
          168.63.129.16
          azure.archive.ubuntu.com
          download.eclipse.org:443
          esm.ubuntu.com:443
    - uses: actions/checkout@v7.0.1
    - name: Install Webkit + GTK bindings
      run: sudo apt update -yq && sudo apt-get install -yq libwebkit2gtk-4.0-dev
      if: runner.os == 'Linux'
    - name: Set up Maven 3.9.5
      uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
      with:
        maven-version: 3.9.5
    - name: Set up JDK ${{ matrix.jdk }}
      uses: actions/setup-java@v6.0.0
      with:
        java-version: ${{ matrix.jdk }}
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: |
        bash plugins/org.eclipse.epsilon.eunit.cmp.emf/download-emf-compare.sh
        mvn -B -f pom-plain.xml -N install
        mvn -B -f releng/org.eclipse.epsilon.jena.uberjar install
        mvn --batch-mode -U -T 1C clean install
    - name: Run headless test
      uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3
      with:
        run: mvn --batch-mode -f tests/org.eclipse.epsilon.test verify -P plugged
    - name: Full Test Suite
      run: mvn --batch-mode -f tests/org.eclipse.epsilon.test surefire:test -P unit
    - name: Standalone Maven artifacts
      run: mvn --batch-mode -T 1C -f pom-plain.xml compile
    - name: Upload Log
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: metadataLog
        path: tests/org.eclipse.epsilon.test/target/work/data/.metadata/.log
